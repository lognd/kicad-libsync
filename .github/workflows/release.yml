name: Release

# Publishes to PyPI via OIDC trusted publishing -- no API token stored in
# this repo. One-time setup: on pypi.org, go to the project's
# "Publishing" settings and add a trusted publisher with:
#   Owner: <your GitHub org/user>   Repo: kicad-libsync
#   Workflow: release.yml           Environment: pypi
# (leave "Environment" blank if you don't use a GitHub environment gate).
#
# Trigger: push a tag `v<version>` whose version matches project.version in
# pyproject.toml. `make upload` does the bump/commit/tag/push for a patch
# release. The build is the single publish path -- nothing publishes from a
# developer machine.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tag is the release's only input, and a tag that disagrees with
  # pyproject.toml would publish a version nobody asked for -- and PyPI
  # filenames are immutable, so that mistake cannot be taken back. Check it
  # before anything is built.
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: tag matches project.version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "tag=$tag pyproject=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match project.version $version in pyproject.toml -- delete the tag, fix one of the two, and re-tag"
            exit 1
          fi

  # Publishing an artifact that never passed the gate is how a broken
  # release reaches users; re-run the full check against the tagged tree
  # rather than trusting that main was green when the tag was cut.
  check:
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: install
        run: uv sync

      - name: lint
        run: uv run ruff check src/ tests/ && uv run ruff format --check src/ tests/

      - name: typecheck
        run: uv run ty check src/

      - name: test
        run: uv run pytest tests/

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: build sdist and wheel
        run: uv build

      # Metadata that PyPI rejects is only discoverable at upload time
      # otherwise, i.e. after the release is already half done.
      - name: check metadata
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: publish
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
