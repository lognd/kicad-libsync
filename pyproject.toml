[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kicad-libsync"
version = "0.1.0"
description = "Watch a Downloads folder and merge vendor KiCad library zips into your KiCad project"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "lognd" }]
keywords = ["kicad", "eda", "pcb", "library", "ultra-librarian", "snapmagic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Typing :: Typed",
]

dependencies = [
    "typani>=0.0.3",
    "pydantic>=2.12.0",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/lognd/kicad-libsync"
Repository = "https://github.com/lognd/kicad-libsync"
Documentation = "https://github.com/lognd/kicad-libsync/blob/main/docs/configuration.md"
Issues = "https://github.com/lognd/kicad-libsync/issues"

[project.scripts]
kicad-libsync = "kicad_libsync.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3.8.0",
    "ruff>=0.8",
    "ty>=0.0.1a8",
]

[tool.setuptools]
packages = { find = { where = ["src"] } }

[tool.setuptools.package-data]
kicad_libsync = ["py.typed", "logging/config.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 88
extend-exclude = [".claude"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.src]
exclude = [".claude/**"]
